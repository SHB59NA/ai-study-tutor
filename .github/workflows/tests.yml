name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package reviewed source
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: artifacts/source.zip
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx pytest-cov
      - name: Run offline regression tests
        run: python -m pytest -q --junitxml=artifacts/junit.xml --cov=app --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml
      - name: Record installed versions
        if: always()
        run: python -m pip freeze > artifacts/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            artifacts/junit.xml
            artifacts/coverage.xml
            artifacts/environment.txt
          retention-days: 14
